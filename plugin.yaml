name: social-bridge
version: "1.0.1"
description: Hybrid social research — browser for X/LinkedIn (no API), API for IG/FB/YT/TikTok. Permanent desktop plugin like Newswire, no repeated login.
author: Euphoria
provides_tools:
  - social_search
  - social_read
  - social_refresh
  - social_post
  - social_scrape
provides_hooks:
  - post_tool_call
capabilities: []
# NOTE: runtime deps (httpx, beautifulsoup4, playwright) are pre-installed in
# the backend venv by the operator. They are intentionally NOT declared here:
# a declaration forces an interactive y/N consent gate that the Desktop's
# non-interactive git-install can never pass ("dependency install skipped").
# If you add a NEW third-party import, declare it here AND prepare it via an
# interactive `hermes plugins install --force` / `update` from a terminal.
config_schema:
  poll_interval_seconds:
    type: integer
    default: 900
    description: "Poll interval for watchlist (seconds, 300-3600)"
  platforms_enabled:
    type: array
    default: ["x", "linkedin", "instagram", "youtube"]
    description: "Enabled platforms"
